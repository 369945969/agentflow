# AgentFlow API Server Configuration

# Server settings
server:
  # The port on which the server will listen (default: 3000)
  port: 3000
  # Enable/disable debug mode (default: false)
  debug: false

# Database settings
database:
  # Path to the DuckDB database file (default: ./data/agentflow.duckdb)
  path: "./data/agentflow.duckdb"
  # Optional: database name or connection parameters
  name: "agentflow"

# Skills configuration
skills:
  # Path to the directory containing skills
  path: "../../skills"
